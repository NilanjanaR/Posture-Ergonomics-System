<!-- base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posture & Ergonomics</title>
    
    <!-- මෙතන තමයි බ්‍රව්සර් ටැබ් එකේ ලෝගෝ එක දාන්නේ -->
    <link rel="icon" type="image/png" href="/static/images/health.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b131e; 
            color: #0f172a;
            display: flex;
            min-height: 100vh;
        }

        /* === Sidebar එක === */
        .sidebar {
            width: 280px; 
            background-color: #0b131e; 
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px; 
            margin-bottom: 40px;
            padding-left: 5px; 
        }

        .logo-img {
            width: 80px;   
            height: 80px;  
            object-fit: contain;
            filter: drop-shadow(0px 0px 5px rgba(255,255,255,0.1)); 
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem; 
            font-weight: 700;
            line-height: 1.3;
            color: #ffffff;
        }
        
        .nav-links { 
            list-style: none; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            flex: 1; 
        }
        
        .nav-links li a {
            color: #8ba3b8;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            display: block;
            font-weight: 500;
            transition: 0.2s;
            font-size: 1.05rem;
        }
        
        .nav-links li a:hover, .nav-links li a.active {
            background-color: #1a2a3a;
            color: #14b8a6;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ef4444; 
            text-decoration: none;
            padding: 12px 15px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: 0.2s;
            margin-top: auto; 
            border-top: 1px solid #1f2e3d; 
            border-radius: 0; 
            padding-top: 20px; 
        }
        
        .logout-btn:hover {
            background-color: transparent;
            color: #f87171;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background-color: #f8fafc; 
            border: 4px solid #0b131e; 
            border-radius: 20px; 
            margin: 15px; 
        }

        .content-area {
            padding: 40px 50px;
            flex: 1;
        }
        
        h1 { font-size: 2rem; margin-bottom: 20px; color: #0f172a; }
        
        .card {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 30px;
            border: 2px solid #14b8a6; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-area">
            <img src="/static/images/health.png" alt="Logo" class="logo-img">
            <div class="logo-text">POSTURE &<br>ERGONOMICS<br>MONITORING SYSTEM</div>
        </div>

        <ul class="nav-links">
            <li><a href="/dashboard" class="{% if request.path == '/dashboard' %}active{% endif %}">Dashboard</a></li>
            <li><a href="/scan" class="{% if request.path == '/scan' %}active{% endif %}">Posture Scan</a></li>
            <li><a href="/recommendations" class="{% if request.path == '/recommendations' %}active{% endif %}">Recommendations</a></li>
            <li><a href="/history" class="{% if request.path == '/history' %}active{% endif %}">History</a></li>
            <li><a href="/profile" class="{% if request.path == '/profile' %}active{% endif %}">Profile</a></li>
        </ul>

        <a href="/logout" class="logout-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Sign Out
        </a>
    </div>

    <div class="main-wrapper">
        <div class="content-area">
            {% block content %}{% endblock %}
        </div>
    </div>

</body>
</html>
